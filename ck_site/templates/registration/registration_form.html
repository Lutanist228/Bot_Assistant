{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <div class="card">
    <div class="card-header">
      Регистрация пользователя
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <input type="hidden" name="telegram_id" value="2">
        {% bootstrap_button button_type="submit" content="Зарегистрироваться" %}
      </form>
    </div>
  </div>
{% endblock %}
